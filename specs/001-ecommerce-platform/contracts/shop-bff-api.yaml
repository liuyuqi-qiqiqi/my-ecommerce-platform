openapi: 3.0.3
info:
  title: Shop BFF API
  description: Shopper-facing REST API for the E-Commerce Platform PC Web frontend.
    All requests route through Spring Cloud Gateway at /api.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Local gateway

tags:
  - name: Catalog
  - name: Auth
  - name: Profile
  - name: Addresses
  - name: Cart
  - name: Orders

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: ORDER_NOT_FOUND
        message:
          type: string
          example: 订单不存在

    ProductSummary:
      type: object
      required: [id, name, price, primaryImageUrl, inStock]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: decimal
        brandName:
          type: string
        primaryImageUrl:
          type: string
        inStock:
          type: boolean

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [description, categoryName, stockQuantity]
          properties:
            description:
              type: string
            categoryName:
              type: string
            stockQuantity:
              type: integer

    ProductSearchResult:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token TTL in seconds

    UserProfile:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
        phone:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    Address:
      type: object
      required: [id, recipientName, phone, province, city, district, street, postalCode]
      properties:
        id:
          type: integer
          format: int64
        recipientName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        street:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean

    AddressRequest:
      type: object
      required: [recipientName, phone, province, city, district, street, postalCode]
      properties:
        recipientName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        street:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
          default: false

    CartItem:
      type: object
      required: [productId, productName, unitPrice, quantity, lineSubtotal, available]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unitPrice:
          type: number
          format: decimal
        quantity:
          type: integer
          minimum: 1
        lineSubtotal:
          type: number
          format: decimal
        available:
          type: boolean

    Cart:
      type: object
      required: [items, subtotal, itemCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: decimal
        itemCount:
          type: integer

    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          default: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    CheckoutRequest:
      type: object
      required: [addressId]
      properties:
        addressId:
          type: integer
          format: int64

    OrderSummary:
      type: object
      required: [id, orderNumber, status, totalAmount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, SHIPPED, DELIVERED]
        totalAmount:
          type: number
          format: decimal
        createdAt:
          type: string
          format: date-time

    ShipmentInfo:
      type: object
      properties:
        carrier:
          type: string
        trackingNumber:
          type: string
        status:
          type: string
          enum: [PENDING, SHIPPED, IN_TRANSIT, DELIVERED]
        statusUpdatedAt:
          type: string
          format: date-time

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, address, subtotal, shippingFee, paymentMethod]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CartItem'
            address:
              $ref: '#/components/schemas/Address'
            subtotal:
              type: number
              format: decimal
            shippingFee:
              type: number
              format: decimal
            paymentMethod:
              type: string
            shipment:
              $ref: '#/components/schemas/ShipmentInfo'

paths:
  /products/featured:
    get:
      tags: [Catalog]
      summary: List featured products for homepage
      operationId: getFeaturedProducts
      responses:
        '200':
          description: Featured product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummary'

  /products/search:
    get:
      tags: [Catalog]
      summary: Search and filter products
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Keyword search
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: brandId
          in: query
          schema:
            type: integer
            format: int64
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'

  /products/{productId}:
    get:
      tags: [Catalog]
      summary: Get product detail
      operationId: getProductById
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new shopper account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Account temporarily locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Signed out

  /profile:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      tags: [Profile]
      summary: Update profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /addresses:
    get:
      tags: [Addresses]
      summary: List delivery addresses
      operationId: listAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags: [Addresses]
      summary: Create delivery address
      operationId: createAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /addresses/{addressId}:
    put:
      tags: [Addresses]
      summary: Update address
      operationId: updateAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    delete:
      tags: [Addresses]
      summary: Delete address
      operationId: deleteAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Address deleted

  /cart:
    get:
      tags: [Cart]
      summary: Get current cart
      operationId: getCart
      description: Works for guest (session cookie) and authenticated users
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid product or quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cart/items/{productId}:
    put:
      tags: [Cart]
      summary: Update item quantity
      operationId: updateCartItem
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /orders/checkout:
    post:
      tags: [Orders]
      summary: Place order from cart
      operationId: checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          description: Empty cart, invalid address, or stock conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    get:
      tags: [Orders]
      summary: List order history
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Order list newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                    format: int64

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order detail with shipment
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
