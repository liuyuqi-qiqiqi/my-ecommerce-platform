# ============================================================
# Nginx Configuration - E-Commerce Frontend
# Roles: Static file server + Reverse proxy to API Gateway
# ============================================================

# ---- Upstream: API Gateway ----
upstream gateway {
    server gateway:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable these when HTTPS is configured:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Client body size (for file uploads) ----
    client_max_body_size 10m;

    # ---- Health check endpoint ----
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ---- API Reverse Proxy → Gateway ----
    location /api/ {
        proxy_pass http://gateway/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;

        # Don't cache API responses
        add_header Cache-Control "no-store" always;
        proxy_no_cache $http_authorization;
    }

    # ---- Static Assets (hashed filenames → aggressive cache) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Favicon ----
    location = /favicon.ico {
        expires 1w;
        access_log off;
    }

    # ---- Other static files (JS, CSS, images, fonts) ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA Routing: fallback to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
