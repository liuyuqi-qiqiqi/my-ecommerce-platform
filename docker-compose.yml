# ============================================================
# E-Commerce Platform - Production Docker Compose
# One-command deploy:
#   docker compose up -d
# Build + deploy:
#   docker compose up -d --build
# ============================================================

name: ecommerce

# ---- Networks ----
networks:
  ecommerce-net:
    driver: bridge
    name: ecommerce-net

# ---- Volumes ----
volumes:
  mysql_data:
    name: ecommerce-mysql-data
  es_data:
    name: ecommerce-es-data

# ============================================================
# Infrastructure Services
# ============================================================
services:

  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema only; catalog data is seeded by product-service CatalogDataInitializer after Flyway
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-ecommerce}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- RabbitMQ 3 ----
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- Elasticsearch 8 ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Nacos (Service Registry) ----
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ecommerce-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Zipkin (Distributed Tracing) ----
  zipkin:
    image: openzipkin/zipkin:3.1
    container_name: ecommerce-zipkin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZIPKIN_PORT:-9411}:9411"
    networks:
      - ecommerce-net

# ============================================================
# Backend Microservices
# ============================================================

  # ---- API Gateway (port 8080) ----
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ecommerce-gateway:${TAG:-latest}
    container_name: ecommerce-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks:
      - ecommerce-net
    depends_on:
      nacos:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---- Shop BFF (port 8085) ----
  shop-bff:
    build:
      context: .
      dockerfile: shop-bff/Dockerfile
    image: ecommerce-shop-bff:${TAG:-latest}
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - ecommerce-net
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---- Product Service (port 8081) ----
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    image: ecommerce-product-service:${TAG:-latest}
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ES_URIS: ${ES_URIS:-http://elasticsearch:9200}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ---- User Service (port 8082) ----
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: ecommerce-user-service:${TAG:-latest}
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      JWT_SECRET: ${JWT_SECRET}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ---- Cart Service (port 8083) ----
  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    image: ecommerce-cart-service:${TAG:-latest}
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ---- Order Service (port 8084) ----
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: ecommerce-order-service:${TAG:-latest}
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

# ============================================================
# Frontend (Nginx + Vue SPA)
# ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecommerce-frontend:${TAG:-latest}
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ecommerce-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
